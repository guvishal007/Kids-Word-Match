<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kids Word Match</title>
  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Animated background bubbles -->
  <div class="bubble-container" aria-hidden="true">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <!-- Fullscreen Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div id="app">
    <!-- Header / HUD Bar -->
    <header class="hud-bar">
      <button id="btn-back" class="circle-btn hidden" aria-label="Go Back">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="hud-center">
        <h1 id="game-title" class="hud-title">Kids Matcher!</h1>
      </div>
      <div class="hud-right">
        <!-- Audio settings toggle -->
        <button id="btn-sound" class="circle-btn active" aria-label="Toggle Sound">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <!-- Stars count indicator -->
        <div class="hud-stars">
          <span class="star-icon">⭐</span>
          <span id="star-count">0</span>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-view">
      <!-- 1. Home / Category Selection Screen -->
      <section id="screen-home" class="view-screen">
        <h2 class="section-title">Select a Matching Game!</h2>
        <div class="category-grid">
          <!-- Shadow Match -->
          <button class="category-card" data-mode="shadow">
            <div class="card-icon gradient-orange">👥</div>
            <div class="card-info">
              <h3>Shadow Match</h3>
              <p>Match items to their silhouettes!</p>
            </div>
          </button>
          <!-- Word Match -->
          <button class="category-card" data-mode="word">
            <div class="card-icon gradient-purple">📝</div>
            <div class="card-info">
              <h3>Word Match</h3>
              <p>Connect pictures to their names!</p>
            </div>
          </button>
          <!-- Alphabet Match -->
          <button class="category-card" data-mode="alphabet">
            <div class="card-icon gradient-blue">🔤</div>
            <div class="card-info">
              <h3>ABC Match</h3>
              <p>Match Big letters with Small letters!</p>
            </div>
          </button>
          <!-- Count Match -->
          <button class="category-card" data-mode="count">
            <div class="card-icon gradient-green">🔢</div>
            <div class="card-info">
              <h3>Count Match</h3>
              <p>Count items and match the number!</p>
            </div>
          </button>
        </div>
      </section>

      <!-- 2. Game Play Screen -->
      <section id="screen-game" class="view-screen hidden">
        <div class="game-hud">
          <div class="progress-bar-container">
            <div id="game-progress" class="progress-bar-fill" style="width: 0%"></div>
          </div>
          <span id="game-level-text">Round 1/3</span>
        </div>

        <div id="game-canvas-area" class="game-canvas-area">
          <!-- Left side: Source objects (Draggable) -->
          <div id="source-container" class="matching-column source-column"></div>
          
          <!-- Right side: Target items (Drop Zones) -->
          <div id="target-container" class="matching-column target-column"></div>
        </div>
      </section>
    </main>

    <!-- Reward / Completion Modal -->
    <div id="reward-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-decoration">🎉</div>
        <h2 id="reward-title">Super Job!</h2>
        <p id="reward-subtitle">You matched all objects correctly!</p>
        
        <div class="earned-stars-display">
          <span class="earned-star anim-star-1">⭐</span>
          <span class="earned-star anim-star-2">⭐</span>
          <span class="earned-star anim-star-3">⭐</span>
        </div>

        <div class="modal-buttons">
          <button id="btn-modal-home" class="btn btn-secondary">Home</button>
          <button id="btn-modal-next" class="btn btn-primary">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
